<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIDS — Gestiune Proiecte</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap');
  :root {
    --ink:#0f1117;--ink2:#3a3d4a;--ink3:#7a7f8e;--bg:#f5f4f0;--bg2:#eceae4;
    --white:#fffffe;--accent:#c8401a;--accent2:#e8855e;
    --green:#2d6a4f;--green-light:#d8f3dc;--yellow:#b5850a;--yellow-light:#fff3cd;
    --red:#c8401a;--red-light:#fde8e3;--blue:#1a4db5;--blue-light:#dce8ff;
    --grey-light:#e8e6e0;--shadow:0 2px 12px rgba(15,17,23,0.08);--shadow-lg:0 8px 32px rgba(15,17,23,0.12);--radius:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}

  nav{background:var(--ink);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;}
  .nav-logo{font-family:'DM Serif Display',serif;color:var(--white);font-size:1.2rem;}
  .nav-logo span{color:var(--accent2);}
  .nav-tabs{display:flex;gap:4px;}
  .nav-tab{color:#aab0bf;background:none;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:0.875rem;font-weight:500;transition:all .2s;}
  .nav-tab:hover{background:rgba(255,255,255,0.08);color:var(--white);}
  .nav-tab.active{background:var(--accent);color:var(--white);}
  .btn-doc-mini{background:none;border:1px solid var(--blue);color:var(--blue);border-radius:4px;padding:1px 6px;font-size:.7rem;cursor:pointer;vertical-align:middle;}
  .btn-doc-mini:hover{background:var(--blue-light);}
  .btn-doc-quick{background:var(--white);border:1.5px solid var(--grey-light);color:var(--ink2);border-radius:8px;padding:6px 14px;font-size:.8rem;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;display:inline-flex;align-items:center;gap:5px;}
  .btn-doc-quick:hover{border-color:var(--accent);color:var(--accent);background:var(--red-light);}
  .text-red{color:var(--red)!important;}
  .text-yellow{color:var(--yellow)!important;}
  .text-green{color:var(--green)!important;}

  .page{display:none;padding:28px 24px;max-width:1400px;margin:0 auto;}
  .page.active{display:block;}

  .page-title{font-family:'DM Serif Display',serif;font-size:1.9rem;color:var(--ink);margin-bottom:4px;}
  .page-subtitle{color:var(--ink3);font-size:0.88rem;margin-bottom:24px;}

  .stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:28px;}
  .stat-card{background:var(--white);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border-top:3px solid transparent;cursor:pointer;transition:transform .15s,box-shadow .15s;}
  .stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
  .stat-card.all{border-top-color:var(--ink);}
  .stat-card.executie{border-top-color:var(--blue);}
  .stat-card.semnare{border-top-color:var(--yellow);}
  .stat-card.suspendat{border-top-color:#9b5de5;}
  .stat-card.finalizat{border-top-color:var(--green);}
  .stat-num{font-family:'DM Serif Display',serif;font-size:2rem;color:var(--ink);}
  .stat-label{font-size:0.78rem;color:var(--ink3);font-weight:500;margin-top:2px;}

  .filter-row{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
  .filter-label{font-size:0.78rem;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
  .filter-btn{padding:6px 14px;border-radius:20px;border:1.5px solid var(--grey-light);background:var(--white);color:var(--ink2);font-size:0.8rem;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}
  .filter-btn:hover{border-color:var(--accent);color:var(--accent);}
  .filter-btn.active{background:var(--ink);color:white;border-color:var(--ink);}
  .search-input{margin-left:auto;padding:7px 14px;border:1.5px solid var(--grey-light);border-radius:20px;background:var(--white);font-family:'DM Sans',sans-serif;font-size:0.875rem;color:var(--ink);width:220px;outline:none;transition:border-color .2s;}
  .search-input:focus{border-color:var(--accent);}

  .projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px;}
  .project-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;border:1.5px solid transparent;}
  .project-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--bg2);}
  .card-status-bar{height:3px;}
  .status-executie{background:var(--blue);}
  .status-semnare{background:var(--yellow);}
  .status-suspendat{background:#9b5de5;}
  .status-finalizat{background:var(--green);}
  .status-inchis{background:var(--ink3);}
  .status-predat{background:#20a4a4;}
  .card-header{padding:16px 18px 12px;}
  .card-nr{font-size:0.7rem;color:var(--ink3);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px;}
  .card-title{font-size:0.9rem;font-weight:600;color:var(--ink);line-height:1.4;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-beneficiar{font-size:0.76rem;color:var(--ink3);margin-bottom:7px;}
  .card-badges{display:flex;gap:7px;flex-wrap:wrap;}
  .badge{padding:3px 9px;border-radius:12px;font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .badge-executie{background:var(--blue-light);color:var(--blue);}
  .badge-semnare{background:var(--yellow-light);color:var(--yellow);}
  .badge-suspendat{background:#f0e6ff;color:#6b21a8;}
  .badge-finalizat{background:var(--green-light);color:var(--green);}
  .badge-inchis{background:var(--grey-light);color:var(--ink3);}
  .badge-predat{background:#d1f5f5;color:#0d7272;}
  .badge-type{background:var(--bg2);color:var(--ink2);}
  .card-body{padding:12px 18px;}
  .card-dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .date-label{font-size:0.68rem;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}
  .date-value{font-size:0.83rem;color:var(--ink);font-weight:500;}
  .deadline-label{display:flex;justify-content:space-between;font-size:0.73rem;color:var(--ink3);margin-bottom:4px;}
  .deadline-label span:last-child{font-weight:600;}
  .progress-track{height:4px;background:var(--bg2);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;border-radius:4px;}
  .progress-ok{background:var(--green);}
  .progress-warn{background:var(--yellow);}
  .progress-danger{background:var(--red);}
  .progress-done{background:var(--ink3);}
  .card-footer{padding:10px 18px;background:var(--bg);border-top:1px solid var(--bg2);display:flex;justify-content:space-between;align-items:center;}
  .card-valoare{font-size:0.83rem;font-weight:600;color:var(--ink);}
  .card-valoare span{color:var(--ink3);font-size:0.7rem;font-weight:400;}
  .zile-ok{color:var(--green);}
  .zile-warn{color:var(--yellow);}
  .zile-danger{color:var(--red);}
  .zile-done{color:var(--ink3);}
  .btn-edit-card{background:var(--bg2);color:var(--ink2);border:none;border-radius:7px;padding:5px 12px;font-family:'DM Sans',sans-serif;font-size:0.76rem;font-weight:600;cursor:pointer;transition:background .15s;}
  .btn-edit-card:hover{background:var(--grey-light);color:var(--ink);}

  /* DETAIL */
  .back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--ink3);font-size:0.85rem;font-weight:500;background:none;border:none;cursor:pointer;margin-bottom:18px;padding:0;font-family:'DM Sans',sans-serif;transition:color .15s;}
  .back-btn:hover{color:var(--ink);}
  .detail-header{background:var(--white);border-radius:var(--radius);padding:24px 28px;box-shadow:var(--shadow);margin-bottom:20px;border-left:4px solid var(--accent);}
  .detail-nr{font-size:0.78rem;color:var(--ink3);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:7px;}
  .detail-title{font-family:'DM Serif Display',serif;font-size:1.45rem;color:var(--ink);line-height:1.35;margin-bottom:14px;}
  .detail-meta{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;}
  .meta-item .meta-key{font-size:0.7rem;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
  .meta-item .meta-val{font-size:0.88rem;color:var(--ink);font-weight:500;}
  .meta-item .meta-val.big{font-family:'DM Serif Display',serif;font-size:1.1rem;color:var(--accent);}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
  .detail-section{background:var(--white);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);}
  .detail-section.full{grid-column:1/-1;}
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .section-title{font-size:0.73rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);display:flex;align-items:center;gap:8px;}
  .section-title::after{content:'';flex:1;height:1px;background:var(--bg2);}
  .btn-add-row{background:var(--accent);color:white;border:none;border-radius:7px;padding:5px 12px;font-family:'DM Sans',sans-serif;font-size:0.76rem;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn-add-row:hover{background:#a83414;}

  /* TIMELINE */
  .timeline{display:flex;flex-direction:column;}
  .tl-item{display:flex;gap:12px;padding:10px 8px;border-radius:8px;transition:background .15s;position:relative;}
  .tl-item:hover{background:var(--bg);}
  .tl-item:hover .tl-actions{opacity:1;}
  .tl-actions{opacity:1 !important;}
  .tl-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.68rem;font-weight:700;flex-shrink:0;margin-top:2px;}
  .dot-done{background:var(--green-light);color:var(--green);}
  .dot-progress{background:var(--blue-light);color:var(--blue);}
  .dot-warn{background:var(--yellow-light);color:var(--yellow);}
  .dot-danger{background:var(--red-light);color:var(--red);}
  .dot-empty{background:var(--bg2);color:var(--ink3);}
  .tl-content{flex:1;min-width:0;}
  .tl-event{font-size:0.875rem;font-weight:500;color:var(--ink);line-height:1.4;}
  .tl-meta{display:flex;gap:14px;margin-top:3px;flex-wrap:wrap;}
  .tl-date{font-size:0.73rem;color:var(--ink3);}
  .tl-date strong{color:var(--ink2);}
  .tl-obs{font-size:0.73rem;color:var(--ink3);margin-top:3px;font-style:italic;line-height:1.4;}
  .tl-right{display:flex;align-items:flex-start;gap:8px;flex-shrink:0;}
  .tl-actions{opacity:0;display:flex;gap:4px;transition:opacity .15s;}
  .btn-icon{background:none;border:1px solid var(--grey-light);border-radius:6px;padding:3px 7px;cursor:pointer;font-size:0.75rem;color:var(--ink3);transition:all .15s;}
  .btn-icon:hover{background:var(--bg2);color:var(--ink);}
  .btn-icon.del:hover{background:var(--red-light);color:var(--red);border-color:var(--red);}

  /* SUBCONTRACTANTI */
  .subctr-list{display:flex;flex-direction:column;gap:10px;}
  .subctr-item{background:var(--bg);border-radius:8px;padding:12px 14px;border-left:3px solid var(--accent2);position:relative;}
  .subctr-item:hover .subctr-actions{opacity:1;}
  .subctr-actions{opacity:1 !important;}
  .subctr-firma{font-size:0.875rem;font-weight:600;color:var(--ink);margin-bottom:3px;}
  .subctr-det{font-size:0.76rem;color:var(--ink3);display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;}
  .subctr-det span{color:var(--ink2);font-weight:500;}
  .subctr-obs{font-size:0.73rem;color:var(--ink3);margin-top:4px;font-style:italic;}
  .subctr-actions{position:absolute;top:8px;right:8px;opacity:0;display:flex;gap:4px;transition:opacity .15s;}

  /* FIN GRID */
  .fin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .fin-item{background:var(--bg);border-radius:8px;padding:12px 14px;}
  .fin-label{font-size:0.7rem;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
  .fin-val{font-size:0.95rem;font-weight:700;color:var(--ink);}
  .fin-val.accent{color:var(--accent);}
  .fin-val.green{color:var(--green);}
  .fin-val.blue{color:var(--blue);}

  /* ALERTE */
  .alerts-panel{display:flex;flex-direction:column;gap:7px;}
  .alert-item{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:8px;font-size:0.8rem;position:relative;}
  .alert-item:hover .alert-del{opacity:1;}
  .alert-del{opacity:1 !important;}
  .alert-item.danger{background:var(--red-light);color:var(--red);}
  .alert-item.warn{background:var(--yellow-light);color:var(--yellow);}
  .alert-item.info{background:var(--blue-light);color:var(--blue);}
  .alert-icon{font-size:0.95rem;flex-shrink:0;}
  .alert-del{position:absolute;right:8px;top:50%;transform:translateY(-50%);opacity:0;background:none;border:none;cursor:pointer;font-size:0.8rem;color:inherit;transition:opacity .15s;}

  /* MODAL */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,17,23,0.55);z-index:200;align-items:center;justify-content:center;padding:16px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--white);border-radius:16px;padding:28px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
  .modal-title{font-family:'DM Serif Display',serif;font-size:1.3rem;margin-bottom:20px;color:var(--ink);}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-group{display:flex;flex-direction:column;gap:5px;}
  .form-group.full{grid-column:1/-1;}
  .form-label{font-size:0.76rem;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;}
  .form-input,.form-select,.form-textarea{padding:9px 12px;border:1.5px solid var(--grey-light);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.875rem;color:var(--ink);background:var(--bg);outline:none;transition:border-color .2s;}
  .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent);background:var(--white);}
  .form-textarea{resize:vertical;min-height:72px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
  .btn-cancel{padding:9px 22px;border-radius:8px;border:1.5px solid var(--grey-light);background:var(--white);color:var(--ink2);font-family:'DM Sans',sans-serif;font-size:0.875rem;font-weight:600;cursor:pointer;}
  .btn-save{padding:9px 22px;border-radius:8px;border:none;background:var(--accent);color:white;font-family:'DM Sans',sans-serif;font-size:0.875rem;font-weight:600;cursor:pointer;}

  .empty-note{color:var(--ink3);font-size:0.83rem;padding:10px 0;text-align:center;}

  /* DOCUMENTE */
  .doc-list{display:flex;flex-direction:column;gap:8px;}
  .doc-item{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:8px;padding:12px 14px;border-left:3px solid var(--blue);}
  .doc-icon{font-size:1.4rem;flex-shrink:0;}
  .doc-content{flex:1;min-width:0;}
  .doc-name{font-size:.875rem;font-weight:600;color:var(--ink);margin-bottom:3px;}
  .doc-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .doc-tip{background:var(--blue-light);color:var(--blue);font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:10px;text-transform:uppercase;}
  .doc-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;}
  .btn-doc-open{background:var(--blue);color:white;border:none;border-radius:7px;padding:5px 12px;font-family:'DM Sans',sans-serif;font-size:.76rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;}
  .btn-doc-open:hover{background:#1339a0;}
  .btn-edit-header{background:var(--white);color:var(--ink2);border:1.5px solid var(--grey-light);border-radius:8px;padding:7px 16px;font-family:'DM Sans',sans-serif;font-size:0.83rem;font-weight:600;cursor:pointer;transition:all .15s;}
  .btn-edit-header:hover{border-color:var(--accent);color:var(--accent);}


  /* TERMEN DEPASIT PE CARD */
  .card-depasit{border:2px solid var(--red)!important;}

  /* URGENT BANNER */
  .urgent-banner{background:var(--red-light);border:1.5px solid var(--red);border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start;}
  .urgent-banner-title{font-size:.8rem;font-weight:700;color:var(--red);margin-bottom:5px;}
  .urgent-item{font-size:.78rem;color:var(--red);padding:2px 0;}

  /* VALOARE TOTALA */
  .stat-card.valoare{border-top:3px solid var(--green);}
  .stat-num.small{font-size:1.1rem;}

  /* FILTRARE BENEFICIAR */
  .beneficiar-filter{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;}
  .benef-btn{background:var(--bg2);color:var(--ink3);border:1.5px solid var(--grey-light);border-radius:20px;padding:4px 12px;font-size:.72rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;}
  .benef-btn:hover,.benef-btn.active{background:var(--accent2);color:white;border-color:var(--accent2);}

  /* CAUTARE GLOBALA DOCUMENTE */
  .doc-search-modal{position:fixed;inset:0;background:rgba(15,17,23,0.7);z-index:300;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;}
  .doc-search-modal.open{display:flex;}
  .doc-search-box{background:var(--white);border-radius:16px;padding:24px;width:100%;max-width:700px;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
  .doc-search-result{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--bg);margin-bottom:6px;cursor:pointer;transition:background .15s;}
  .doc-search-result:hover{background:var(--bg2);}
  .doc-search-proj{font-size:.7rem;color:var(--ink3);font-weight:600;text-transform:uppercase;}
  .doc-search-name{font-size:.85rem;font-weight:500;color:var(--ink);}

  /* JURNAL */
  .jurnal-entry{background:var(--bg);border-radius:8px;padding:10px 14px;margin-bottom:8px;border-left:3px solid var(--accent2);position:relative;}
  .jurnal-entry:hover .jurnal-del{opacity:1;}
  .jurnal-del{position:absolute;right:8px;top:8px;opacity:0;background:none;border:none;cursor:pointer;color:var(--ink3);font-size:.8rem;transition:opacity .15s;}
  .jurnal-date{font-size:.7rem;color:var(--ink3);font-weight:600;margin-bottom:3px;}
  .jurnal-text{font-size:.83rem;color:var(--ink);line-height:1.5;}

  /* ZILE RAMASE PE ETAPA */
  .etapa-zile{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:10px;white-space:nowrap;}
  .etapa-zile.ok{background:var(--green-light);color:var(--green);}
  .etapa-zile.warn{background:var(--yellow-light);color:var(--yellow);}
  .etapa-zile.danger{background:var(--red-light);color:var(--red);}
  .etapa-zile.done{background:var(--bg2);color:var(--ink3);}

  @media(max-width:860px){
    .stats-row{grid-template-columns:repeat(3,1fr);}
    .projects-grid{grid-template-columns:1fr;}
    .detail-grid{grid-template-columns:1fr;}
    .form-grid{grid-template-columns:1fr;}
    .form-group.full{grid-column:1;}
  }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">CIDS <span>/ Proiecte</span></div>
  <div class="nav-tabs">
    <button class="nav-tab active" id="tab-dash" onclick="showPage('dashboard')">📊 Dashboard</button>
    <button class="nav-tab" id="tab-detail" style="display:none" onclick="showPage('detail-page')">📋 Proiect</button>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <button class="btn-primary" style="background:#1a4db5" onclick="document.getElementById('import-input').click()">📥 Import</button>
    <button class="btn-primary" style="background:#6c3483" onclick="resetFirebase()" title="Rescrie datele din cloud cu versiunea curentă din fișier">🔄 Reset cloud</button>
    <input type="file" id="import-input" accept=".json" style="display:none" onchange="importProiect(this)">
    <button class="btn-primary" style="background:#2d6a4f" id="btn-generator" onclick="openModal('generator',currentDetailId)" style="display:none">📄 Generează</button>
    <button class="btn-primary" onclick="openModal('project')">+ Proiect nou</button>
  </div>
</nav>

<!-- DASHBOARD -->
<div class="page active" id="dashboard">
  <div class="page-title">Portofoliu Proiecte</div>

<script>
// ===================== UTILS =====================
function excelDate(n){if(!n||isNaN(n)||n<1)return null;return new Date((n-25569)*86400*1000);}
function fmtDate(n){const d=typeof n==='number'?excelDate(n):(n?new Date(n):null);if(!d||isNaN(d))return '—';return d.toLocaleDateString('ro-RO',{day:'2-digit',month:'2-digit',year:'numeric'});}
function toInputDate(n){const d=typeof n==='number'?excelDate(n):(n?new Date(n):null);if(!d||isNaN(d))return '';return d.toISOString().split('T')[0];}
function fromInputDate(s){if(!s)return null;const d=new Date(s);return Math.round(d.getTime()/86400000+25569);}
function zilesRamase(t,p){
  if(!t) return null;
  const d=typeof t==='number'?excelDate(t):new Date(t);
  if(!d||isNaN(d)) return null;
  // Daca proiectul e suspendat si are sistare activa, termenul nu curge
  // Afisam zilele ramase la data sistarii, nu fata de azi
  if(p && p.status==='Suspendat' && p.sistari && p.sistari.length>0){
    const sistarActiva=p.sistari.find(s=>s.dataStart && !s.dataStop);
    if(sistarActiva){
      const dataSistare=new Date(sistarActiva.dataStart);
      dataSistare.setHours(0,0,0,0);
      const zileRamaseLaSistare=Math.round((d-dataSistare)/86400000);
      return zileRamaseLaSistare; // Zile ramase la data sistarii (pozitiv = mai era timp)
    }
  }
  const azi=new Date();azi.setHours(0,0,0,0);
  return Math.round((d-azi)/86400000);
}
function zilesLabel(z){if(z===null)return '';if(z>0)return z+' zile rămase';if(z===0)return 'Astăzi!';return 'Depășit '+Math.abs(z)+' zile';}
function zilesClass(z,s){if(s==='Finalizat'||s==='Închis'||s==='Predat')return 'zile-done';if(z===null)return 'zile-done';if(z>30)return 'zile-ok';if(z>0)return 'zile-warn';return 'zile-danger';}
function fmtMoney(v){if(!v)return '—';return Number(v).toLocaleString('ro-RO',{minimumFractionDigits:0,maximumFractionDigits:0})+' lei';}
function scKey(s){const m={'În execuție':'executie','Semnare':'semnare','Suspendat':'suspendat','Finalizat':'finalizat','Închis':'inchis','Predat':'predat'};return m[s]||'executie';}
function badgeHtml(s){const k=scKey(s);return `<span class="badge badge-${k}">${s}</span>`;}
function etapaEsteDepasita(e,p){
  if(e.status==='FINALIZAT') return false;
  const tms=calcTermenEtapaMs(e,p);
  if(!tms) return false;
  return tms < Date.now();
}
function tlDot(s,depasit){
  if(depasit) return {cls:'dot-danger',lbl:'!'};
  if(s==='FINALIZAT') return {cls:'dot-done',lbl:'✓'};
  if(s==='ÎN TERMEN') return {cls:'dot-progress',lbl:'⏳'};
  if(s==='DEPĂȘIT') return {cls:'dot-danger',lbl:'!'};
  if(s==='SUSPENDAT') return {cls:'dot-warn',lbl:'⏸'};
  return {cls:'dot-empty',lbl:'·'};
}
function tsBadge(s,depasit){
  if(depasit) return `<span class="badge" style="background:var(--red-light);color:var(--red)">⚠ DEPĂȘIT</span>`;
  const m={'FINALIZAT':'badge-finalizat','ÎN TERMEN':'badge-executie','DEPĂȘIT':'','SUSPENDAT':'badge-semnare'};
  const cls=m[s]||'';
  const bg={'FINALIZAT':'','ÎN TERMEN':'','DEPĂȘIT':'background:var(--red-light);color:var(--red)','SUSPENDAT':'background:var(--yellow-light);color:var(--yellow)'};
  return s?`<span class="badge ${cls}" style="${bg[s]||''}">${s}</span>`:'';
}
function progressPct(ds,tf){const s=typeof ds==='number'?excelDate(ds):new Date(ds);const e=typeof tf==='number'?excelDate(tf):new Date(tf);if(!s||!e||isNaN(s)||isNaN(e))return 0;const now=new Date();return Math.min(100,Math.max(0,Math.round((now-s)/(e-s)*100)));}
function calcTermenEfectiv(p){
  // Returneaza DOAR termenul unui OI activ (nu Finalizat, nu Neemis)
  const oi=p.ordineIncepere||[];
  if(!oi.length) return null;
  const activ=oi.find(o=>o.termen&&(o.status==='În execuție'||o.status==='În curs'));
  if(activ&&activ.termen) return new Date(activ.termen);
  return null;
}

function calcTermenEtapa(etapa, p){
  // Calculeaza termenul dinamic al unei etape in functie de OI
  if(etapa.termen) return etapa.termen; // Are deja termen fix
  if(!etapa.obs) return null;
  // Incearca sa extraga "X zile de la OI" din obs
  const oi=p.ordineIncepere||[];
  const oiActiv=oi.find(o=>o.data&&o.status!=='Neemis'&&!o.status?.includes('Neemis'));
  if(!oiActiv||!oiActiv.data) return null;
  const match=etapa.obs.match(/(\d+)\s+zile\s+de\s+la\s+OI/i)||etapa.eveniment.match(/\((\d+)\s+zile\s+de\s+la\s+OI\)/i);
  if(!match) return null;
  const zile=parseInt(match[1]);
  const dataOI=new Date(oiActiv.data);
  dataOI.setDate(dataOI.getDate()+zile);
  return Math.round(dataOI.getTime()/86400000+25569); // Returneaza ca Excel serial
}

function calcTermenEtapaMs(etapa, p){
  const t=calcTermenEtapa(etapa, p);
  if(!t) return null;
  if(typeof t==='number') return (t-25569)*86400000;
  if(typeof t==='string') return new Date(t).getTime();
  return null;
}
function getOrdineIncepereHtml(p){
  const oi=p.ordineIncepere||[];
  if(!oi.length) return '';
  return oi.map(o=>{
    const cls=o.status==='Finalizat'?'color:var(--green)':o.status==='În execuție'?'color:var(--accent)':o.data?'color:var(--yellow)':'color:var(--ink3)';
    const icon=o.status==='Finalizat'?'✅':o.status==='În execuție'?'⏳':o.data?'🟡':'⏸';
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid var(--bg3)">
      <span style="font-size:.72rem;color:var(--ink2)"><strong>OI ${o.tip}</strong>${o.data?' · '+o.data:''}</span>
      <span style="font-size:.72rem;${cls}">${icon} ${o.termen?o.termen:o.status}</span>
    </div>`;
  }).join('');
}

    {id:'e16-8g',eveniment:"DGPI 402/29.07.2026 (CIDS 1359/29.07.2026) — PS1 APROBA sistarea temporara",data:46232,termen:46265,status:"SISTAT DE LA 29.08.2026",obs:"IMPORTANT: PS1 este de acord cu sistarea temporara a contractului DGPI 3/20.05.2026, incepand cu data de 29.08.2026 (nu imediat). PS1 precizeaza in aceeasi adresa: 'ordinul de incepere a executiei lucrarilor de reparatii, emis in 17.06.2026, cu termen de finalizare de 45 zile, respectiv 31.08.2026' — dupa ridicarea sistarii mai raman doar 3 zile de executie. ATENTIE — INCONSISTENTA MATEMATICA SEMNALATA: 45 de zile calendaristice de la 17.06.2026 conduc la 01.08.2026 (naiv) / 02.08.2026 (NCPC art.181) — NU la 31.08.2026 asa cum scrie PS1 in aceasta adresa (diferenta este de aproape o luna intreaga). Nu putem determina din documentele disponibile daca: (a) PS1 a facut o eroare de calcul in adresa 402/29.07.2026, (b) exista un alt element care justifica data de 31.08.2026 (ex. o alta interpretare a termenului sau un act aditional neinregistrat inca in Drive), sau (c) OI-ul din 17.06.2026 nu mai este cel relevant. Recomandam ferm clarificarea directa cu DGPI/PS1 a acestei discrepante inainte de a considera oricare dintre cele doua date (02.08.2026 sau 31.08.2026) ca fiind cea corecta si definitiva.",docLink:"https://drive.google.com/file/d/1IOu3oTytBODg9zBIngJz_n6_ZVOsmUPl/view",docNume:"17. DGPI 402/29.07.2026 Ordin sistare lucrari Odai C13"},
    {id:'e16-9',eveniment:"Executie lucrari reconfigurare C13",data:46190,termen:46265,status:"SISTAT DE LA 29.08.2026",obs:"OI oficial DGPI 729/17.06.2026 (PS1→CIDS) — durata 45 zile. ATENTIE — doua date diferite in circulatie: (1) calculul propriu, conform NCPC art.181, aplicat consecvent in acest dosar: 02.08.2026; (2) data comunicata explicit de PS1 in adresa de aprobare a sistarii (doc 17, DGPI 402/29.07.2026): 31.08.2026 — cele doua nu sunt matematic compatibile intre ele (diferenta ~1 luna) desi ambele pretind sa derive din acelasi OI (17.06.2026, 45 zile). Contractul a fost SISTAT TEMPORAR incepand cu 29.08.2026 (aprobat de PS1 29.07.2026), la solicitarea CIDS din 28.07.2026. Dupa ridicarea sistarii, PS1 comunica ca mai raman 3 zile de executie. Recomandam verificare directa cu DGPI pentru a clarifica data reala a termenului inainte de sistare."},

function updateStats(){
  document.getElementById('cnt-all').textContent=proiecte.length;
  document.getElementById('cnt-exec').textContent=proiecte.filter(p=>p.status==='În execuție').length;
  document.getElementById('cnt-semn').textContent=proiecte.filter(p=>p.status==='Semnare').length;
  document.getElementById('cnt-susp').textContent=proiecte.filter(p=>p.status==='Suspendat').length;
  document.getElementById('cnt-fin').textContent=proiecte.filter(p=>['Finalizat','Predat','Închis'].includes(p.status)).length;
  // Valoare totala contracte active
  const active=proiecte.filter(p=>!['Finalizat','Predat','Închis'].includes(p.status));
  const total=active.reduce((s,p)=>s+(p.valoare||0),0);
  const el=document.getElementById('cnt-valoare');
  if(el)el.textContent=total>0?fmtMoney(total):'—';
  // Banner urgent (termene < 7 zile)
  renderUrgentBanner();
  // Filtre beneficiar
  renderBeneficiarFilter();
}

function renderUrgentBanner(){
  const container=document.getElementById('urgent-banner-container');
  if(!container)return;

  const urgente=[];

  proiecte.filter(p=>p.status==='În execuție').forEach(p=>{
    const titlu=p.titlu.replace(/^\d+[-.\s]+/,'').trim();

    // Ia termenul general al proiectului (din OI activ sau termenFinalizare)
    const te=calcTermenEfectiv(p)||p.termenFinalizare;
    if(!te) return;
    const z=zilesRamase(te);
    if(z===null) return;
    // Arata: depasit (oricand) SAU in urmatoarele 14 zile
    if(z>14) return;

    // Gaseste prima etapa activa cu termen — asta e ce trebuie facut
    const etapeActive=(p.etape||[]).filter(e=>
      e.status!=='FINALIZAT' && e.termen &&
      !e.eveniment.toLowerCase().includes('receptie finala') &&
      !e.eveniment.toLowerCase().includes('garantie')
    );

    // Mesaj clar: ce trebuie predat/finalizat
    let actiune='Finalizare și predare contract';
    if(etapeActive.length>0){
      actiune=etapeActive[0].eveniment
        .replace(/\(.*?\)/g,'')
        .replace(/—.*/,'')
        .replace(/termen\s*\d+.*$/i,'')
        .replace(/\s+/g,' ')
        .trim();
      if(actiune.length>65) actiune=actiune.substring(0,65)+'…';
    }

    urgente.push({pid:p.id, titlu, actiune, zile:z, depasit:z<0});
  });

  if(!urgente.length){container.innerHTML='';return;}
  urgente.sort((a,b)=>a.zile-b.zile);

  const areDepasit=urgente.some(u=>u.depasit||u.zile<=3);
  const culoare=areDepasit?'var(--red)':'var(--yellow)';
  const culoareBg=areDepasit?'var(--red-light)':'var(--yellow-light)';

  container.innerHTML=`<div class="urgent-banner" style="background:${culoareBg};border-color:${culoare}">
    <div style="font-size:1.3rem">${areDepasit?'🚨':'⏰'}</div>
    <div style="flex:1">
      <div class="urgent-banner-title" style="color:${culoare}">TERMENE URGENTE — proiecte în execuție</div>
      ${urgente.map(u=>{
        const icon=u.depasit?'❌':u.zile===0?'🔴 AZI':u.zile<=3?'🔴':'🟡';
        const timp=u.depasit
          ?`<strong style="color:var(--red)">DEPĂȘIT cu ${Math.abs(u.zile)} zile</strong>`
          :u.zile===0?`<strong>AZI</strong>`
          :`<strong>${u.zile} ${u.zile===1?'zi':'zile'}</strong>`;
        return `<div class="urgent-item" onclick="showDetail(${u.pid})" style="cursor:pointer;padding:5px 0;border-bottom:1px solid ${culoare}25;display:flex;gap:8px;align-items:baseline">
          <span>${icon}</span>
          <span>${timp}</span>
          <span style="font-weight:700;color:var(--ink)">${u.titlu}</span>
          <span style="color:var(--ink2);font-size:.78rem">→ ${u.actiune}</span>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

let currentBeneficiar=null;
function renderBeneficiarFilter(){
  const container=document.getElementById('benef-filter');
  if(!container)return;
  const shortNames=b=>{
    if(b.includes('UTILIT'))return 'DUPS';
    if(b.includes('PATRIMONIU'))return 'DGPI';
    if(b.includes('SECTOR')||b.includes('PRIMĂRIA')||b.includes('PRIMARIA'))return 'PS1';
    return b.substring(0,15);
  };
  // Grupeaza beneficiarii cu acelasi shortName
  const grupuri={};
  proiecte.forEach(p=>{
    const short=shortNames(p.beneficiar);
    if(!grupuri[short]) grupuri[short]=[];
    if(!grupuri[short].includes(p.beneficiar)) grupuri[short].push(p.beneficiar);
  });
  _grupuriCache=grupuri;
  container.innerHTML=`<span style="font-size:.72rem;color:var(--ink3);font-weight:600">Beneficiar:</span>
    <button class="benef-btn ${!currentBeneficiar&&!currentBeneficiarGrup?'active':''}" onclick="filterBeneficiar(null,this)">Toți</button>
    ${Object.entries(grupuri).map(([short,lista],gi)=>`<button class="benef-btn ${currentBeneficiarGrup&&lista.some(b=>currentBeneficiarGrup.includes(b))?'active':''}" onclick="filterBeneficiarGrup(${gi},this)">${short}</button>`).join('')}`;
}

function filterBeneficiar(b,btn){
  currentBeneficiar=b;
  currentBeneficiarGrup=null;
  document.querySelectorAll('.benef-btn').forEach(x=>x.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderDashboard();
}

let currentBeneficiarGrup=null;
let _grupuriCache={};
function filterBeneficiarGrup(gi,btn){
  const lista=Object.values(_grupuriCache)[gi]||[];
  currentBeneficiar=null;
  currentBeneficiarGrup=lista;
  document.querySelectorAll('.benef-btn').forEach(x=>x.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderDashboard();
}

function renderDashboard(){
  updateStats();
  let list=proiecte;
  if(currentFilter!=='all'){
    if(currentFilter==='__tip_Eveniment') list=list.filter(p=>p.tip==='Eveniment');
    else if(currentFilter==='Finalizat') list=list.filter(p=>['Finalizat','Predat','Închis'].includes(p.status));
    else list=list.filter(p=>p.status===currentFilter);
  }
  if(currentSearch){const q=currentSearch.toLowerCase();list=list.filter(p=>p.titlu.toLowerCase().includes(q)||p.nrCIDS.toLowerCase().includes(q)||p.nrDGPI.toLowerCase().includes(q)||p.beneficiar.toLowerCase().includes(q));}
  if(currentBeneficiar){list=list.filter(p=>p.beneficiar===currentBeneficiar);}
  if(currentBeneficiarGrup&&currentBeneficiarGrup.length){list=list.filter(p=>currentBeneficiarGrup.includes(p.beneficiar));}
  if(currentBeneficiarGrup){list=list.filter(p=>currentBeneficiarGrup.includes(p.beneficiar));}
  
  // Sortare: proiectele active se sorteaza dupa termenul cel mai apropiat (urgente primul)
  // Proiectele fara termen sau finalizate merg la final
  const isDoneStatus = p => ['Finalizat','Predat','Închis'].includes(p.status);
  const toMs = t => {
    if(!t) return null;
    if(t instanceof Date) return t.getTime();
    if(typeof t === 'number') return (t - 25569) * 86400000; // Excel serial to ms
    if(typeof t === 'string') return new Date(t).getTime();
    return null;
  };
  list = [...list].sort((a,b)=>{
    const aDone = isDoneStatus(a);
    const bDone = isDoneStatus(b);
    if(aDone && bDone) return 0;
    if(aDone) return 1;
    if(bDone) return -1;
    const ta = toMs(calcTermenEfectiv(a)) || toMs(a.termenFinalizare);
    const tb = toMs(calcTermenEfectiv(b)) || toMs(b.termenFinalizare);
    const aDepasit = ta && ta < Date.now();
    const bDepasit = tb && tb < Date.now();
    // Depasit intotdeauna primul
    if(aDepasit && !bDepasit) return -1;
    if(!aDepasit && bDepasit) return 1;
    // Ambele depasit: cel mai depasit primul (ta mai mic = depasit de mai mult timp)
    if(aDepasit && bDepasit) return ta - tb;
    // Ambele in termen: cel mai urgent primul
    if(!ta && !tb) return 0;
    if(!ta) return 1;
    if(!tb) return -1;
    return ta - tb;
  });
  const g=document.getElementById('projects-grid');
  if(!list.length){g.innerHTML='<div class="empty-note" style="grid-column:1/-1;padding:48px">Niciun proiect găsit.</div>';return;}
  g.innerHTML=list.map(p=>{
    const sc=scKey(p.status);
    const te=calcTermenEfectiv(p);
    const tAfis=te||p.termenFinalizare;
    const isDone=p.status==='Finalizat'||p.status==='Închis'||p.status==='Predat';
    const z=isDone?null:zilesRamase(tAfis,p);
    const pct=isDone?100:te?progressPct(p.dataOI||p.dataSemnare,te):progressPct(p.dataSemnare,p.termenFinalizare);
    const pcls=isDone?'progress-done':z!==null&&z<0?'progress-danger':pct>85?'progress-warn':'progress-ok';
    const depasitTermen = !isDone && z !== null && z < 0 && p.status === 'În execuție';
    return `<div class="project-card${depasitTermen?' card-depasit':''}" onclick="showDetail(${p.id})">
      <div class="card-status-bar status-${sc}"></div>
      ${depasitTermen?`<div style="background:var(--red);color:white;font-size:.7rem;font-weight:700;padding:4px 12px;letter-spacing:.03em">⚠ TERMEN DEPĂȘIT cu ${Math.abs(z)} zile — în așteptare act adițional</div>`:''}
      <div class="card-header">
        <div class="card-nr">${p.nrCIDS} · ${p.nrDGPI}</div>
        <div class="card-title">${p.titlu}</div>
        <div class="card-beneficiar">${p.beneficiar.length>65?p.beneficiar.slice(0,65)+'…':p.beneficiar}</div>
        <div class="card-badges">${badgeHtml(p.status)}<span class="badge badge-type">${p.tip}</span></div>
      </div>
      <div class="card-body">
        <div class="card-dates">
          <div><div class="date-label">Semnat</div><div class="date-value">${fmtDate(p.dataSemnare)}</div></div>
          <div><div class="date-label">Termen contractual</div><div class="date-value">${fmtDate(p.termenFinalizare)||'—'}</div></div>
        </div>
        ${(p.ordineIncepere&&p.ordineIncepere.length>0)?`<div style="margin-top:6px">${getOrdineIncepereHtml(p)}</div>`:''}
        ${p.sistari&&p.sistari.length>0?`<div style="font-size:.68rem;color:var(--yellow);margin-top:4px">⏸ Sistare: ${p.sistari.map(s=>fmtDate(s.dataStart)+(s.dataStop?' → '+fmtDate(s.dataStop):' (în curs)')).join(', ')}</div>`:''}
        <div class="deadline-label" style="margin-top:6px"><span>Progres</span><span class="${zilesClass(z,p.status)}">${isDone?'✅ Finalizat':zilesLabel(z)}</span></div>
        <div class="progress-track"><div class="progress-fill ${pcls}" style="width:${p.status==='Finalizat'||p.status==='Închis'?100:pct}%"></div></div>
      </div>
      <div class="card-footer">
        <div><div class="card-valoare">${fmtMoney(p.valoare)} <span>fără TVA</span></div><div style="font-size:.72rem;color:var(--ink3)">Subctr: <strong style="color:var(--accent)">${(p.subcontractanti||[]).length}</strong></div></div>
        <button class="btn-edit-card" onclick="event.stopPropagation();openModal('project',${p.id})">✏️ Editează</button>
      </div>
    </div>`;
  }).join('');
}

function genDocx(continut, numeFisier){
  // Incarca docx library din CDN
  const script=document.createElement('script');
  script.src='https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.umd.min.js';
  script.onload=function(){
    const {Document,Packer,Paragraph,TextRun,AlignmentType,Header,Footer,PageNumber,NumberFormat}=window.docx;

    // Parseaza continutul in paragrafe
    const linii=continut.split('\n');
    const children=[];

    // Antet
    children.push(new Paragraph({
      alignment:AlignmentType.CENTER,
      spacing:{after:0},
      children:[new TextRun({text:'COMPANIA DE INVESTIȚII ȘI DEZVOLTARE SECTORUL 1 S.A.',bold:true,size:22,font:'Times New Roman'})]
    }));
    children.push(new Paragraph({
      alignment:AlignmentType.CENTER,
      spacing:{after:0},
      children:[new TextRun({text:'Calea Griviței nr. 357, Sector 1, București',size:18,font:'Times New Roman',color:'555555'})]
    }));
    children.push(new Paragraph({
      border:{bottom:{style:'single',size:6,color:'8B0000',space:4}},
      spacing:{after:280},
      children:[new TextRun({text:'',size:4})]
    }));

    let titluAdaugat=false;
    linii.forEach(linie=>{
      const l=linie.trim();
      if(!l){children.push(new Paragraph({spacing:{after:80},children:[new TextRun({text:'',font:'Times New Roman',size:24})]}));return;}

      // Prima linie majuscula = titlu
      if(!titluAdaugat&&l===l.toUpperCase()&&l.length>5){
        titluAdaugat=true;
        children.push(new Paragraph({
          alignment:AlignmentType.CENTER,
          spacing:{before:120,after:360},
          children:[new TextRun({text:l,bold:true,size:28,font:'Times New Roman'})]
        }));
      } else {
        children.push(new Paragraph({
          alignment:AlignmentType.JUSTIFIED,
          spacing:{after:120},
          indent:{left:0},
          children:[new TextRun({text:l,size:24,font:'Times New Roman'})]
        }));
      }
    });

    const doc=new Document({
      sections:[{
        properties:{
          page:{
            size:{width:11906,height:16838},
            margin:{top:1417,right:1134,bottom:1417,left:1701}
          }
        },
        children
      }]
    });

    Packer.toBlob(doc).then(blob=>{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=numeFisier+'.docx';
      a.click();
      URL.revokeObjectURL(url);
    });
  };
  script.onerror=function(){
    // Fallback la .txt daca CDN nu e disponibil
    const blob=new Blob([continut],{type:'text/plain;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=numeFisier+'.txt';
    a.click();
    URL.revokeObjectURL(url);
    showSaveIndicator('⚠️ Salvat ca .txt (Word indisponibil)','#b5850a');
  };
  document.head.appendChild(script);
}

function importProiect(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      // Poate fi un proiect singular sau array
      const lista=Array.isArray(data)?data:[data];
      let adaugate=0;
      lista.forEach(p=>{
        if(!p.titlu){return;}
        // ID nou unic
        p.id=proiecte.length?Math.max(...proiecte.map(x=>x.id))+1+adaugate:1;
        p.etape=p.etape||[];
        p.subcontractanti=p.subcontractanti||[];
        p.alerte=p.alerte||[];
        p.documente=p.documente||[];
        proiecte.push(p);
        adaugate++;
      });
      saveData();
      renderDashboard();
      showSaveIndicator('✓ '+adaugate+' proiect(e) importat(e)','#2d6a4f');
      input.value='';
    }catch(err){
      alert('Fișier invalid. Asigură-te că e un JSON generat din această aplicație.');
      input.value='';
    }
  };
  reader.readAsText(file);
}

function exportProiect(pid){
  const p=proiecte.find(x=>x.id===pid);
  if(!p)return;
  const blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='proiect_'+p.nrCIDS.replace(/[^a-z0-9]/gi,'_')+'.json';
  a.click();URL.revokeObjectURL(url);
  closeModal();
  showSaveIndicator('✓ Document generat!','#2d6a4f');
}

function docIcon(tip){
  const m={'Contract':'📄','Factură':'🧾','PV':'📋','Autorizație':'🏛️','Ofertă':'📨','Ordin':'📌','Situație lucrări':'📊','Garanție':'🔒','Asigurare':'🛡️','Altele':'📎'};
  return m[tip]||'📎';
}

function getPreviewUrl(link){
  if(!link) return null;
  // Convert any Drive link format to embed/preview
  const m = link.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(m) return 'https://drive.google.com/file/d/'+m[1]+'/preview';
  // Already a folder or other link
  return link;
}

function openDocPreview(link, name){
  if(!link) return;
  // Always open directly in new tab
  const m = link.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if(m){
    window.open('https://drive.google.com/file/d/'+m[1]+'/view','_blank');
  } else {
    window.open(link,'_blank');
  }
}

function closeDocPreview(){ }

function renderDocs(p){
  // Deduplica documentele la randare (nu la merge) - pastreaza prima aparitie per ID fisier
  const extractId=l=>{if(!l)return null;const m=l.match(/\/d\/([a-zA-Z0-9_-]+)/);return m?m[1]:null;};
  const vazute=new Set();
  const docs=(p.documente||[]).filter(d=>{
    const key=extractId(d.link)||d.link||(d.nume||'').trim().toLowerCase();
    if(vazute.has(key))return false;
    vazute.add(key);
    return true;
  });
  return docs.map((d,i)=>`
    <div class="doc-item">
      <div class="doc-icon">${docIcon(d.tip)}</div>
      <div class="doc-content">
        <div class="doc-name">${d.nume}</div>
        <div class="doc-meta">
          <span class="doc-tip">${d.tip}</span>
          ${d.data?`<span style="font-size:.72rem;color:var(--ink3)">${d.data}</span>`:''}
          ${d.obs?`<span style="font-size:.72rem;color:var(--ink3);font-style:italic">${d.obs}</span>`:''}
        </div>
      </div>
      <div class="doc-actions">
        ${d.link?`<button class="btn-doc-open" onclick="openDocPreview('${d.link}','${d.nume.replace(/'/g,"\\'")}')">👁 Vezi</button>`:'<span style="font-size:.72rem;color:var(--ink3)">Fără link</span>'}
        <button class="btn-icon" onclick="openModal('document',${p.id},null,${i})">✏️</button>
        <button class="btn-icon del" onclick="deleteDocument(${p.id},${i})">🗑</button>
      </div>
    </div>`).join('')||'<div class="empty-note">Niciun document adăugat. Apasă + pentru a adăuga.</div>';
}

function deleteDocument(pid,idx){
  if(!confirm('Ștergi acest document?'))return;
  const p=proiecte.find(x=>x.id===pid);
  if(!p)return;
  p.documente=p.documente||[];
  const docSters=p.documente[idx];
  const docKey=docSters?(docSters.link||docSters.nume):'';
  p.documente.splice(idx,1);
  document.getElementById('doc-list-'+pid).innerHTML=renderDocs(p);
  if(db){
    // Salvam cheia documentului sters intr-o lista neagra in Firebase
    db.collection('cids').doc('sterse').get().then(snap=>{
      let sterse={};
      if(snap.exists&&snap.data()) sterse=snap.data();
      const cheie='p'+pid;
      if(!sterse[cheie]) sterse[cheie]=[];
      if(docKey&&!sterse[cheie].includes(docKey)) sterse[cheie].push(docKey);
      return db.collection('cids').doc('sterse').set(sterse,{merge:true});
    }).then(()=>{
      return db.collection('cids').doc('proiecte').get();
    }).then(snap=>{
      let current=proiecte;
      if(snap.exists&&snap.data()&&snap.data().data){
        try{
          const fromCloud=JSON.parse(snap.data().data);
          if(fromCloud&&fromCloud.length>0){
            const idx2=fromCloud.findIndex(x=>x.id===pid);
            if(idx2>=0)fromCloud[idx2].documente=p.documente;
            current=fromCloud;
            proiecte=fromCloud;
          }
        }catch(e){}
      }
      return db.collection('cids').doc('proiecte').set({data:JSON.stringify(current),ts:Date.now()},{merge:true});
    }).then(()=>showSaveIndicator('✓ Document șters din cloud','#2d6a4f'))
    .catch(()=>{
      try{localStorage.setItem('cids_local',JSON.stringify(proiecte));}catch(e){}
      showSaveIndicator('✓ Șters local (offline)','#b5850a');
    });
  } else {
    try{localStorage.setItem('cids_local',JSON.stringify(proiecte));}catch(e){}
    showSaveIndicator('✓ Șters','#2d6a4f');
  }
}

    // Documente

    if(docs.length>0){
      doc+='<h2>Documente</h2>';
      doc+='<table><tr><th>Denumire</th><th>Tip</th><th>Data</th></tr>';
      docs.forEach(d=>{
        doc+='<tr><td>'+(d.nume||'-')+'</td><td>'+(d.tip||'-')+'</td><td>'+(d.data||'-')+'</td></tr>';
      });
      doc+='</table>';
    }

    doc+='<p style="text-align:center;font-size:9pt;color:#999;margin-top:20pt">CIDS - Compania de Investitii si Dezvoltare Sectorul 1 S.A. | '+azi+'</p>';
    doc+='';    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    const nume='Raport_'+p.titlu.replace(/[^a-zA-Z0-9 ]/g,'').trim().replace(/ +/g,'_').substring(0,30)+'.doc';
    a.download=nume;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    showSaveIndicator('Raport Word descarcat!','#2d6a4f');
  }catch(err){
    alert('Eroare export: '+err.message);
  }
}
function searchInProject(q,pid){
  if(!q||q.length<2){
    document.querySelectorAll('.tl-item,.subctr-item,.doc-item').forEach(el=>el.style.display='');
    return;
  }
  const ql=q.toLowerCase();
  document.querySelectorAll('#timeline-'+pid+' .tl-item').forEach(el=>{
    el.style.display=el.textContent.toLowerCase().includes(ql)?'':'none';
  });
  document.querySelectorAll('#subctr-list-'+pid+' .subctr-item').forEach(el=>{
    el.style.display=el.textContent.toLowerCase().includes(ql)?'':'none';
  });
  document.querySelectorAll('#doc-list-'+pid+' .doc-item').forEach(el=>{
    el.style.display=el.textContent.toLowerCase().includes(ql)?'':'none';
  });
}
function renderAlerts(p){
  return (p.alerte||[]).map((a,i)=>`

      <span class="alert-icon">${a.tip==='danger'?'🔴':a.tip==='warn'?'🟡':'ℹ️'}</span>

function modalSave(){
  const {pid,eid}=modalTarget;
  const p=pid?proiecte.find(x=>x.id===pid):null;

  if(modalMode==='project'){
    const titlu=document.getElementById('f-titlu').value.trim();
    if(!titlu){alert('Te rog completează titlul.');return;}
    const isNew=!p;
    const obj={
      id:isNew?(proiecte.length?Math.max(...proiecte.map(x=>x.id))+1:1):p.id,
      titlu,
      nrDGPI:document.getElementById('f-dgpi').value.trim()||'—',
      nrCIDS:document.getElementById('f-cids').value.trim()||'—',
      beneficiar:document.getElementById('f-benef').value.trim()||'—',
      valoare:parseFloat(document.getElementById('f-val').value)||0,
      status:document.getElementById('f-status').value,
      tip:document.getElementById('f-tip').value,
      dataSemnare:fromInputDate(document.getElementById('f-semnat').value)||(p?p.dataSemnare:null),
      termenFinalizare:fromInputDate(document.getElementById('f-termen').value)||(p?p.termenFinalizare:null),
      gbe:document.getElementById('f-gbe').value.trim()||'—',
      gbeRestituire:document.getElementById('f-gbe-rest').value.trim()||'—',
      observatii:document.getElementById('f-obs').value.trim(),
      ordineIncepere:(()=>{
        const existing=p?p.ordineIncepere||[]:[];
        return existing.map((o,i)=>({
          ...o,
          data:document.getElementById('f-oi-data-'+i)?.value||o.data||null,
          termen:document.getElementById('f-oi-termen-'+i)?.value||o.termen||null,
          status:document.getElementById('f-oi-status-'+i)?.value||o.status
        }));
      })(),
      sistari:(()=>{
        const start=document.getElementById('f-sistare-start')?.value;
        const stop=document.getElementById('f-sistare-stop')?.value;
        const existing=p?p.sistari||[]:[];
        if(start&&stop){
          const nou={dataStart:fromInputDate(start),dataStop:fromInputDate(stop)};
          // Daca exista deja o sistare identica nu o adaugam din nou
          const existe=existing.find(s=>s.dataStart===nou.dataStart&&s.dataStop===nou.dataStop);
          if(!existe) return [...existing,nou];
        }
        return existing;
      })(),
      acteAditionale:p?p.acteAditionale||[]:[],
      etape:p?p.etape:[],
      subcontractanti:p?p.subcontractanti:[],
      alerte:p?p.alerte:[],
      documente:p?p.documente:[]  // ← PĂSTREAZĂ ÎNTOTDEAUNA documentele existente
    };
    if(isNew) proiecte.push(obj);
    else proiecte[proiecte.findIndex(x=>x.id===pid)]=obj;
  }
  else if(modalMode==='etapa'){
    const ev=document.getElementById('f-ev').value.trim();
    if(!ev){alert('Te rog completează evenimentul.');return;}
    const isNew=!eid;
    const obj={
      id:isNew?'e'+pid+'-'+Date.now():eid,
      eveniment:ev,
      data:fromInputDate(document.getElementById('f-data').value),
      termen:fromInputDate(document.getElementById('f-termen').value),
      status:document.getElementById('f-status').value,
      docLink:document.getElementById('f-doc-link')?document.getElementById('f-doc-link').value.trim():'',
      docNume:document.getElementById('f-doc-nume-eta')?document.getElementById('f-doc-nume-eta').value.trim():'',
      obs:document.getElementById('f-obs').value.trim()
    };
    if(isNew) p.etape.push(obj);
    else {const idx=p.etape.findIndex(x=>x.id===eid);p.etape[idx]=obj;}
  }
  else if(modalMode==='subctr'){
    const firma=document.getElementById('f-firma').value.trim();
    if(!firma){alert('Te rog completează firma.');return;}
    const isNew=!eid;
    const valRaw=document.getElementById('f-val').value.trim();
    const obj={
      id:isNew?'s'+pid+'-'+Date.now():eid,
      firma,
      obiect:document.getElementById('f-obiect').value.trim(),
      contract:document.getElementById('f-ctr').value.trim(),
      valoare:valRaw,
      dataSemnare:fromInputDate(document.getElementById('f-data-sem').value),
      termen:fromInputDate(document.getElementById('f-termen').value),
      status:document.getElementById('f-status').value,
      gbe:document.getElementById('f-gbe').value.trim(),

      documente:isNew?[]:(p.subcontractanti.find(x=>x.id===eid)||{}).documente||[]
    };
    if(isNew) p.subcontractanti.push(obj);
    else {const idx=p.subcontractanti.findIndex(x=>x.id===eid);p.subcontractanti[idx]=obj;}
  }
  else if(modalMode==='etapa-sub'){
    const {pid:_pid,eid:sid,ei}=modalTarget;

    const obj={

    };
    if(ei!==undefined) s.etape[ei]={...s.etape[ei],...obj,id:s.etape[ei].id};
    else s.etape.push(obj);
  }
  else if(modalMode==='doc-sub'){
    const {pid:_pid,eid:sid,di}=modalTarget;
    const s=p.subcontractanti.find(x=>x.id===sid);
    if(!s)return;
    s.documente=s.documente||[];
    const nume=document.getElementById('f-doc-nume').value.trim();
    if(!nume){alert('Te rog completează numele documentului.');return;}
    const obj={
      nume,
      tip:document.getElementById('f-doc-tip').value,
      data:document.getElementById('f-doc-data').value.trim(),
      link:document.getElementById('f-doc-link').value.trim(),
      obs:document.getElementById('f-doc-obs').value.trim()
    };
    if(di!==undefined) s.documente[di]=obj;
    else s.documente.push(obj);
  }
  if(modalMode==='generator'){
    genDoc();
    return;
  }
  else if(modalMode==='document'){
    const nume=document.getElementById('f-doc-nume').value.trim();
    if(!nume){alert('Te rog completează numele documentului.');return;}
    const obj={
      nume,
      tip:document.getElementById('f-doc-tip').value,
      data:document.getElementById('f-doc-data').value.trim(),
      link:document.getElementById('f-doc-link').value.trim(),
      obs:document.getElementById('f-doc-obs').value.trim()
    };
    p.documente=p.documente||[];
    const docIdx=modalTarget.eid;
    if(docIdx!==null&&docIdx!==undefined) p.documente[docIdx]=obj;
    else p.documente.push(obj);
  }
  else if(modalMode==='alerta'){
    const text=document.getElementById('f-text').value.trim();
    if(!text){alert('Te rog completează textul alertei.');return;}
    p.alerte=p.alerte||[];
    p.alerte.push({tip:document.getElementById('f-tip').value,text});

  closeModal();
  renderDashboard();
  if(currentDetailId) showDetail(currentDetailId);
  saveData();

function deleteEtapa(pid,eid){
  if(!confirm('Ștergi această etapă?'))return;
  const p=proiecte.find(x=>x.id===pid);
  p.etape=p.etape.filter(x=>x.id!==eid);
  showDetail(pid);
  saveData();
}
function mutaEtapa(pid,eid,directie){
  const p=proiecte.find(x=>x.id===pid);
  if(!p||!p.etape) return;
  const idx=p.etape.findIndex(e=>e.id===eid);
  if(idx===-1) return;
  const newIdx=idx+directie;
  if(newIdx<0||newIdx>=p.etape.length) return;
  // Schimba pozitiile
  const temp=p.etape[idx];
  p.etape[idx]=p.etape[newIdx];
  p.etape[newIdx]=temp;
  showDetail(pid);
  saveData();
}

  showDetail(pid);
  saveData();

function getJurnal(pid){
  try{const j=localStorage.getItem('jurnal_'+pid);return j?JSON.parse(j):[];}catch(e){return [];}
}
function saveJurnal(pid,entries){
  try{localStorage.setItem('jurnal_'+pid,JSON.stringify(entries));}catch(e){}
}
function addJurnalEntry(pid){
  const text=document.getElementById('jurnal-input-'+pid)?.value?.trim();
  if(!text)return;
  const entries=getJurnal(pid);
  entries.unshift({data:new Date().toLocaleDateString('ro-RO'),text});
  saveJurnal(pid,entries);
  document.getElementById('jurnal-input-'+pid).value='';
  renderJurnal(pid);
}
function deleteJurnalEntry(pid,idx){
  const entries=getJurnal(pid);
  entries.splice(idx,1);
  saveJurnal(pid,entries);
  renderJurnal(pid);
}
function renderJurnal(pid){
  const entries=getJurnal(pid);
  const container=document.getElementById('jurnal-list-'+pid);
  if(!container)return;
  container.innerHTML=entries.length?entries.map((e,i)=>`
    <div class="jurnal-entry">
      <button class="jurnal-del" onclick="deleteJurnalEntry(${pid},${i})">✕</button>
      <div class="jurnal-date">📅 ${e.data}</div>
      <div class="jurnal-text">${e.text}</div>
    </div>`).join(''):'<div class="empty-note">Nicio intrare în jurnal.</div>';
}

function openDocSearch(){
  document.getElementById('doc-search-modal').classList.add('open');
  setTimeout(()=>document.getElementById('doc-search-input').focus(),100);
  searchDocs('');
}

function searchDocs(q){
  const results=[];
  const ql=q.toLowerCase();
  proiecte.forEach(p=>{
    (p.documente||[]).forEach(d=>{
      if(!q||d.nume.toLowerCase().includes(ql)||(d.obs||'').toLowerCase().includes(ql)){
        results.push({proiect:p.titlu,pid:p.id,nume:d.nume,tip:d.tip,data:d.data,link:d.link,obs:d.obs});
      }
    });
  });
  const container=document.getElementById('doc-search-results');
  if(!results.length){container.innerHTML='<div class="empty-note">Niciun document găsit.</div>';return;}
  container.innerHTML=results.slice(0,50).map(r=>`
    <div class="doc-search-result" onclick="document.getElementById('doc-search-modal').classList.remove('open');showDetail(${r.pid})">
      <div style="font-size:1.2rem">${docIcon(r.tip)}</div>
      <div style="flex:1;min-width:0">
        <div class="doc-search-proj">${r.proiect}</div>
        <div class="doc-search-name">${r.nume}</div>
        ${r.obs?`<div style="font-size:.72rem;color:var(--ink3);font-style:italic">${r.obs}</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        ${r.data?`<span style="font-size:.7rem;color:var(--ink3)">${r.data}</span>`:''}
        ${r.link?`<button class="btn-doc-open" style="font-size:.72rem;padding:3px 10px" onclick="event.stopPropagation();openDocPreview('${r.link}','${r.nume.replace(/'/g,"\'")}')">👁 Vezi</button>`:''}
      </div>
    </div>`).join('');
  if(results.length>50)container.innerHTML+=`<div class="empty-note">${results.length-50} rezultate suplimentare — rafinează căutarea.</div>`;
}

    const etapeActive=(p.etape||[]).filter(e=>e.status!=='FINALIZAT');

// Încearcă Firebase în background
(function(){
  const s1=document.createElement('script');
  s1.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
  s1.onload=function(){
    const s2=document.createElement('script');
    s2.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js';
    s2.onload=function(){
      try{
        firebase.initializeApp(FB_CONFIG);
        db=firebase.firestore();
        // Citim mai intai lista documentelor sterse
        db.collection('cids').doc('sterse').get().then(snapSterse=>{
          const sterseDoc=snapSterse.exists?snapSterse.data():{};
          return db.collection('cids').doc('proiecte').get().then(snap=>{return {snap,sterseDoc};});
        })
        .then(({snap,sterseDoc})=>{
            if(snap.exists && snap.data() && snap.data().data){
              const saved=JSON.parse(snap.data().data);
              if(saved && saved.length>0){
                // MERGE: codul e sursa de adevar pentru structura proiectului
                // Din Firebase pastram DOAR: etapele editate manual si documentele adaugate manual
                const proiecteCod=[...proiecte];
                proiecte=proiecteCod.map(pCod=>{
                  const pFirebase=saved.find(p=>p.id===pCod.id);
                  if(!pFirebase) return pCod; // proiect nou in cod, nu in Firebase
                  
                  // Etape: folosim etapele din COD ca baza, dar pastram statusul/obs editat in Firebase
                  const etapeFinal=(pCod.etape||[]).map(eCod=>{
                    const eFirebase=(pFirebase.etape||[]).find(e=>e.id===eCod.id);
                    if(eFirebase) return {...eCod, status:eFirebase.status, obs:eFirebase.obs||eCod.obs, docLink:eFirebase.docLink||eCod.docLink, docNume:eFirebase.docNume||eCod.docNume};
                    return eCod;
                  });
                  // Etape adaugate manual in Firebase (nu exista in cod)
                  const idEtapeCod=new Set((pCod.etape||[]).map(e=>e.id));
                  (pFirebase.etape||[]).forEach(eF=>{if(!idEtapeCod.has(eF.id)) etapeFinal.push(eF);});
                  
                  // Documente: folosim documentele din COD ca baza
                  // Excludem documentele sterse (din lista neagra) si adaugam cele manuale din Firebase
                  const cheieSterse='p'+pCod.id;
                  const sterseList=(sterseDoc&&sterseDoc[cheieSterse])||[];
                  const linkuriCod=new Set((pCod.documente||[]).map(d=>d.link||d.nume));
                  const docManuale=(pFirebase.documente||[]).filter(d=>!linkuriCod.has(d.link||d.nume));
                  const documenteFinal=[...(pCod.documente||[]),...docManuale].filter(d=>!sterseList.includes(d.link||d.nume));
                  
                  // Subcontractanti: folosim din cod ca baza, pastram editarile din Firebase
                  const subFinal=(pCod.subcontractanti||[]).map(sCod=>{
                    const sFirebase=(pFirebase.subcontractanti||[]).find(s=>s.id===sCod.id);
                    if(sFirebase) return {...sCod, status:sFirebase.status||sCod.status, obs:sFirebase.obs||sCod.obs,
                      etape:(()=>{
                        const etS=(sCod.etape||[]).map(eC=>{
                          const eF=(sFirebase.etape||[]).find(e=>e.id===eC.id);
                          return eF?{...eC,status:eF.status,obs:eF.obs||eC.obs}:eC;
                        });
                        const idEC=new Set((sCod.etape||[]).map(e=>e.id));
                        (sFirebase.etape||[]).forEach(eF=>{if(!idEC.has(eF.id)) etS.push(eF);});
                        return etS;
                      })(),
                      documente:(()=>{
                        const lC=new Set((sCod.documente||[]).map(d=>d.link||d.nume));
                        const dM=(sFirebase.documente||[]).filter(d=>!lC.has(d.link||d.nume));
                        return [...(sCod.documente||[]),...dM];
                      })()
                    };
                    return sCod;
                  });
                  // Subcontractanti adaugati manual in Firebase
                  const idSubCod=new Set((pCod.subcontractanti||[]).map(s=>s.id));
                  (pFirebase.subcontractanti||[]).forEach(sF=>{if(!idSubCod.has(sF.id)) subFinal.push(sF);});
                  
                  return {...pCod, etape:etapeFinal, documente:documenteFinal, subcontractanti:subFinal,
                    status:pCod.status,
                    observatii:pCod.observatii,
                    alerte:pCod.alerte,
                    termenFinalizare:pCod.termenFinalizare,
                    ordineIncepere:pCod.ordineIncepere,
                    valoare:pCod.valoare,
                    nrCIDS:pCod.nrCIDS,
                    nrDGPI:pCod.nrDGPI,
                    dataSemnare:pCod.dataSemnare,
                    gbe:pCod.gbe,
                    gbeRestituire:pCod.gbeRestituire,
                    sistari:pCod.sistari,
                    acteAditionale:pCod.acteAditionale
                  };
                });
                renderDashboard();
                saveData();
                showSaveIndicator('✓ Date sincronizate','#2d6a4f');
              } else {
                saveData();
              }
            } else {
              saveData();
            }
          })
          .catch(()=>{
            // Firebase offline - incearca localStorage
            try{
              const ls=localStorage.getItem('cids_local');
              if(ls){const p=JSON.parse(ls);if(p&&p.length>0){proiecte=p;renderDashboard();}}
            }catch(e){}
            showSaveIndicator('⚠️ Offline - date locale','#b5850a');
          });
      }catch(e){}
    };
    document.head.appendChild(s2);
  };
  s1.onerror=function(){
    try{
      const ls=localStorage.getItem('cids_local');
      if(ls){const p=JSON.parse(ls);if(p&&p.length>0){proiecte=p;renderDashboard();}}
    }catch(e){}
  };
  document.head.appendChild(s1);
})();
